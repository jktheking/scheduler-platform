name: scheduler-app

services:
  scheduler-api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_MODULE: scheduler-api
        JAVA_VERSION: "25"
    image: scheduler-api:demo
    container_name: scheduler-api

    # ❗ IMPORTANT:
    # Do NOT use depends_on for services defined in infra compose.
    # Compose validates depends_on against THIS file only.

    environment:
      SPRING_PROFILES_ACTIVE: docker

      SCHEDULER_INGESTION_MODE: KAFKA
      # Bound via @ConfigurationProperties(prefix = "scheduler.ingestion")
      #   scheduler.ingestion.kafka.bootstrap-servers
      #   scheduler.ingestion.kafka.commands-topic
      SCHEDULER_INGESTION_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEDULER_INGESTION_KAFKA_COMMANDS_TOPIC: scheduler.commands.v1

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/scheduler
      SPRING_DATASOURCE_USERNAME: scheduler
      SPRING_DATASOURCE_PASSWORD: scheduler

      SERVER_PORT: "8080"

      # ---- OTel Java Agent ----
      OTEL_SERVICE_NAME: scheduler-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=demo

      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
        -Dotel.javaagent.debug=false
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005

    volumes:
      - ./otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro

    ports:
      - "8080:8080"
      - "5005:5005"

    restart: unless-stopped
    networks: [scheduler-net]

  # ------------------------------------------------------------
  # MASTER (SINGLE MODE ONLY)
  # Start with: docker compose -f demo/docker-compose.app.yml --profile single up -d --build
  # ------------------------------------------------------------
  scheduler-master:
    profiles: ["single"]
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_MODULE: scheduler-master
        JAVA_VERSION: "25"
    image: scheduler-master:demo
    container_name: scheduler-master

    environment:
      SPRING_PROFILES_ACTIVE: docker

      # master is Kafka-driven
      SCHEDULER_MASTER_COMMAND_DRIVER: KAFKA
      # Bound via @ConfigurationProperties(prefix = "scheduler.master")
      #   scheduler.master.kafka.bootstrap-servers
      #   scheduler.master.kafka.commands-topic
      #   scheduler.master.kafka.ready-topic
      #   scheduler.master.kafka.task-state-topic
      SCHEDULER_MASTER_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEDULER_MASTER_KAFKA_COMMANDS_TOPIC: scheduler.commands.v1
      SCHEDULER_MASTER_KAFKA_READY_TOPIC: scheduler.tasks.ready.v1
      SCHEDULER_MASTER_KAFKA_TASK_STATE_TOPIC: scheduler.task.state.v1

      # ---- Master sharding / leader election ----
      # HA disabled => FixedShardLeaderElector (this node owns all shards)
      SCHEDULER_MASTER_SHARDING_ENABLED: "false"
      SCHEDULER_MASTER_SHARDING_SHARDS: "1"
      SCHEDULER_MASTER_SHARDING_NODE_ID: "${HOSTNAME:-scheduler-master}"

  
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/scheduler
      SPRING_DATASOURCE_USERNAME: scheduler
      SPRING_DATASOURCE_PASSWORD: scheduler

      # ---- OTel Java Agent ----
      OTEL_SERVICE_NAME: scheduler-master
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=demo

      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
        -Dotel.javaagent.debug=false
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006

    ports:
      - "5006:5006"

    volumes:
      - ./otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro

    restart: unless-stopped
    networks: [scheduler-net]

  # ------------------------------------------------------------
  # MASTER (HA MODE ONLY, SCALE-SAFE)
  # Start with:
  #   docker compose -f demo/docker-compose.infra.yml --profile ha up -d
  #   docker compose -f demo/docker-compose.app.yml --profile ha up -d --build --scale scheduler-master-ha=2
  # ------------------------------------------------------------
  scheduler-master-ha:
    profiles: ["ha"]
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_MODULE: scheduler-master
        JAVA_VERSION: "25"
    image: scheduler-master:demo
    # IMPORTANT: no container_name (required for scaling)

    environment:
      SPRING_PROFILES_ACTIVE: docker

      # master is Kafka-driven
      SCHEDULER_MASTER_COMMAND_DRIVER: KAFKA
      # Bound via @ConfigurationProperties(prefix = "scheduler.master")
      #   scheduler.master.kafka.bootstrap-servers
      #   scheduler.master.kafka.commands-topic
      #   scheduler.master.kafka.ready-topic
      #   scheduler.master.kafka.task-state-topic
      SCHEDULER_MASTER_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEDULER_MASTER_KAFKA_COMMANDS_TOPIC: scheduler.commands.v1
      SCHEDULER_MASTER_KAFKA_READY_TOPIC: scheduler.tasks.ready.v1
      SCHEDULER_MASTER_KAFKA_TASK_STATE_TOPIC: scheduler.task.state.v1

      # ---- Master sharding / leader election ----
      # HA enabled => EtcdShardLeaderElector (per-shard leases stored in etcd)
      SCHEDULER_MASTER_SHARDING_ENABLED: "true"
      SCHEDULER_MASTER_SHARDING_SHARDS: "2"
      # Must be unique per replica
      SCHEDULER_MASTER_SHARDING_NODE_ID: "${HOSTNAME:-scheduler-master-ha}"
      # Etcd coordination
      SCHEDULER_MASTER_SHARDING_ELECTION_BASE_PATH: "/scheduler/master/shards"
      # Duration string for java.time.Duration (Spring Boot binder)
      SCHEDULER_MASTER_SHARDING_LEASE_TTL: "10s"
      SCHEDULER_MASTER_SHARDING_ETCD_ENDPOINTS: "http://etcd:2379"


      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/scheduler
      SPRING_DATASOURCE_USERNAME: scheduler
      SPRING_DATASOURCE_PASSWORD: scheduler

      # ---- OTel Java Agent ----
      OTEL_SERVICE_NAME: scheduler-master-ha
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=demo

      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
        -Dotel.javaagent.debug=false
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006

    # IMPORTANT: no fixed host port mapping when scaling
    expose:
      - "5006"

    volumes:
      - ./otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro

    restart: unless-stopped
    networks: [scheduler-net]

  scheduler-worker:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_MODULE: scheduler-worker
        JAVA_VERSION: "25"
    image: scheduler-worker:demo
    container_name: scheduler-worker

    environment:
      SPRING_PROFILES_ACTIVE: docker

      # Bound via @ConfigurationProperties(prefix = "scheduler.worker")
      #   scheduler.worker.worker-id
      #   scheduler.worker.kafka.bootstrap-servers
      #   scheduler.worker.kafka.ready-topic
      #   scheduler.worker.kafka.task-state-topic
      SCHEDULER_WORKER_WORKER_ID: worker-1
      SCHEDULER_WORKER_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEDULER_WORKER_KAFKA_READY_TOPIC: scheduler.tasks.ready.v1
      SCHEDULER_WORKER_KAFKA_TASK_STATE_TOPIC: scheduler.task.state.v1

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/scheduler
      SPRING_DATASOURCE_USERNAME: scheduler
      SPRING_DATASOURCE_PASSWORD: scheduler

      # ---- OTel Java Agent ----
      OTEL_SERVICE_NAME: scheduler-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=demo

      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
        -Dotel.javaagent.debug=false
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007

    ports:
      - "5007:5007"

    volumes:
      - ./otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro

    restart: unless-stopped
    networks: [scheduler-net]

  scheduler-alert-server:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_MODULE: scheduler-alert-server
        JAVA_VERSION: "25"
    image: scheduler-alert-server:demo
    container_name: scheduler-alert-server

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "8090"

      # Bound via @ConfigurationProperties(prefix = "scheduler.alert-server")
      #   scheduler.alert-server.kafka.bootstrap-servers
      #   scheduler.alert-server.kafka.topic
      #   scheduler.alert-server.kafka.group-id
      SCHEDULER_ALERT_SERVER_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEDULER_ALERT_SERVER_KAFKA_TOPIC: scheduler.alerts.v1
      SCHEDULER_ALERT_SERVER_KAFKA_GROUP_ID: scheduler-alert-server

      # ---- OTel Java Agent ----
      OTEL_SERVICE_NAME: scheduler-alert-server
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=demo

      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
        -Dotel.javaagent.debug=false
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5008

    ports:
      - "8090:8090"
      - "5008:5008"

    volumes:
      - ./otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro

    restart: unless-stopped
    networks: [scheduler-net]

networks:
  scheduler-net:
    external: true
    name: scheduler-net